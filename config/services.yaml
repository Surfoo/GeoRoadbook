# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.roadbook_dir: '%kernel.project_dir%/public/roadbook'
    app.locales_dir: '%kernel.project_dir%/config/locales'
    app.icon_cache_dir: '32x32'
    # URL the WeasyPrint sidecar uses to reach the web server (raw roadbook view)
    app.internal_base_url: '%env(default:app.internal_base_url_default:INTERNAL_BASE_URL)%'
    app.internal_base_url_default: 'http://webserver'
    # WeasyPrint sidecar converting the raw roadbook view to PDF (dev: Docker HTTP
    # sidecar). In production there is no sidecar — set WEASYPRINT_URL=cli in
    # .env.local to invoke the standalone `weasyprint` binary instead.
    app.weasyprint_url: '%env(default:app.weasyprint_url_default:WEASYPRINT_URL)%'
    app.weasyprint_url_default: 'http://weasyprint:5001'
    # Binary used when app.weasyprint_url is "cli"
    app.weasyprint_bin: '%env(default:app.weasyprint_bin_default:WEASYPRINT_BIN)%'
    app.weasyprint_bin_default: 'weasyprint'
    app.available_sorts: ['none', 'name', 'owner', 'difficulty', 'terrain']
    app.roadbook_themes:
        classic: { label: 'Classic', css: 'roadbook.css' }
        modern:  { label: 'Modern', css: 'roadbook-modern.css' }
    app.locales:
        cs: 'Čeština'
        da: 'Dansk'
        de: 'Deutsch'
        en: 'English'
        es: 'Español'
        fr: 'Français'
        it: 'Italiano'
        lt: 'Lietuvių'
        nl: 'Nederlands'
        pt: 'Português'
        sv: 'Svenska'
        th: 'ภาษาไทย'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Monolog\AppContextProcessor:
        tags:
            - { name: monolog.processor, channel: app }
